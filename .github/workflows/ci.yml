name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  merge_group:

jobs:
  nix:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - macos-26

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout code
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

    - name: Install Nix
      uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
      with:
        extra_nix_config: |
          accept-flake-config = true
          extra-substituters = https://nixcache.jakehillion.me
          extra-trusted-public-keys = nixcache.jakehillion.me-1:HQsjYdrcs3ilS/ngtlbTQXU4Xfsm+va5NN7yoK0wKMg=
          max-jobs = 2
          sandbox = true

    - name: Setup Nix S3 cache
      uses: testquorum/nix-s3-generations@505cc3553746818b68be0f79bc2951f0f379d5cf # v0.1.6
      with:
        s3-endpoint: https://28e45df51086264c6d9cf2b5e6ecc190.r2.cloudflarestorage.com
        bucket: jakehillion-nix
        public-key: nixcache.jakehillion.me-1:HQsjYdrcs3ilS/ngtlbTQXU4Xfsm+va5NN7yoK0wKMg=
        private-key: ${{ secrets.NIX_SIGNING_KEY }}
        region: auto
        aws-access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}

    - name: Enter CI devShell
      uses: nicknovitski/nix-develop@9be7cfb4b10451d3390a75dc18ad0465bed4932a # v1
      with:
        arguments: .#ci

    - name: Build all outputs
      run: nix-fast-build --no-nom --flake ".#checks.$(nix eval --raw --impure --expr builtins.currentSystem)" -j 2 --eval-workers 4

    - name: Run tests from the Nix-built nextest archive
      run: |
        archive="$(nix build --no-link --print-out-paths .#ogygia-nextest-archive)/archive.tar"
        archive_zst="$RUNNER_TEMP/ogygia-nextest-archive.tar.zst"
        zstd -T0 "$archive" -o "$archive_zst"
        cargo nextest run \
          --archive-file "$archive_zst" \
          --workspace-remap "$GITHUB_WORKSPACE" \
          --test-threads num-cpus \
          --no-fail-fast

  # Decides which apple apps need building, on Linux, so that no macOS
  # runner starts for an app that has not changed. An app has changed when
  # its unstamped derivation differs from the base's. The base is the
  # merge base for a pull request and the queue's base for a merge group.
  # Main only advances through the queue with every check green, and the
  # queue merges an entry only once every entry ahead of it has passed, so
  # an unchanged app was built by the run that checked its base.
  #
  # On a push to main, the base is instead the commit of the build last
  # released, from the Sparkle feed for macOS and TestFlight for iOS, so an
  # app is built and released only when it changed, and a release that
  # failed is retried by the next push.
  apple-gate:
    runs-on: ubuntu-26.04

    outputs:
      macos: ${{ steps.compare.outputs.macos }}
      ios: ${{ steps.compare.outputs.ios }}
      runner: ${{ steps.compare.outputs.runner }}

    steps:
    # A pull request's own head rather than its merge with the base, so
    # that the merge base below is meaningful.
    - name: Checkout code
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        fetch-depth: 0

    - name: Install Nix
      uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
      with:
        extra_nix_config: |
          accept-flake-config = true
          extra-substituters = https://nixcache.jakehillion.me
          extra-trusted-public-keys = nixcache.jakehillion.me-1:HQsjYdrcs3ilS/ngtlbTQXU4Xfsm+va5NN7yoK0wKMg=

    # Evaluating the apps needs no macOS builder: nothing in them imports
    # from a derivation. A base that cannot be found or evaluated, for
    # example one from before the apps were split from their versions,
    # counts as a change. On a push, failing to read what was released
    # fails the job instead, so that a broken feed or App Store Connect
    # login cannot quietly release every commit.
    - name: Compare the apps with the base
      id: compare
      env:
        EVENT: ${{ github.event_name }}
        PR_BASE: ${{ github.event.pull_request.base.sha }}
        QUEUE_BASE: ${{ github.event.merge_group.base_sha }}
        ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      run: |
        # Errors inside $(...) stop the script too.
        shopt -s inherit_errexit

        # An unstamped app's store path at a revision.
        unstamped() {
          nix eval --raw "git+file://$GITHUB_WORKSPACE?rev=$2#packages.aarch64-darwin.ogygia-$1-unstamped.outPath"
        }

        # The commit a released build came from. Its build number is the
        # commit count, and main is linear.
        released_commit() {
          if [ -n "$1" ]; then
            git rev-list --reverse HEAD | sed -n "$1p"
          fi
        }

        # The build the Sparkle feed offers.
        macos_released() {
          curl -fsS https://assets.ogygia.dev/macos/appcast.xml |
            sed -n 's:.*<sparkle\:version>\([0-9]*\)</sparkle\:version>.*:\1:p'
        }

        # The newest build on TestFlight. Builds are only ever uploaded in
        # increasing order, so it has the highest build number.
        ios_released() {
          # jwt-cli reads EC keys as DER.
          key="$RUNNER_TEMP/AuthKey.der"
          printf '%s\n' "$ASC_KEY_P8" | openssl pkcs8 -topk8 -nocrypt -outform DER -out "$key"
          token="$(nix run --inputs-from . nixpkgs#jwt-cli -- encode --alg ES256 --kid "$ASC_KEY_ID" \
            --iss "$ASC_ISSUER_ID" --aud appstoreconnect-v1 --exp=+10m --secret "@$key")"
          rm "$key"
          api() { curl -fsSG -H "Authorization: Bearer $token" "https://api.appstoreconnect.apple.com/v1/$1" "${@:2}"; }
          app_id="$(api apps --data-urlencode "filter[bundleId]=dev.ogygia.ios" | jq -r '.data[0].id')"
          api builds --data-urlencode "filter[app]=$app_id" --data-urlencode "sort=-uploadedDate" \
            --data-urlencode "limit=1" --data-urlencode "fields[builds]=version" |
            jq -r '.data[0].attributes.version // empty'
        }

        case "$EVENT" in
          pull_request)
            macos_base="$(git merge-base HEAD "$PR_BASE")" || macos_base=""
            ios_base="$macos_base"
            ;;
          merge_group)
            macos_base="$QUEUE_BASE"
            ios_base="$QUEUE_BASE"
            ;;
          push)
            macos_build="$(macos_released)"
            ios_build="$(ios_released)"
            macos_base="$(released_commit "$macos_build")"
            ios_base="$(released_commit "$ios_build")"
            ;;
        esac

        echo "runner=$(< .github/macos-apps-runner)" >> "$GITHUB_OUTPUT"
        head="$(git rev-parse HEAD)"
        for app in macos ios; do
          base="${app}_base"
          path="$(unstamped "$app" "$head")"
          if [ -n "${!base}" ] && base_path="$(unstamped "$app" "${!base}")" && [ "$path" = "$base_path" ]; then
            echo "::notice::The $app app is unchanged at $path"
            echo "$app=false" >> "$GITHUB_OUTPUT"
          else
            echo "$app=true" >> "$GITHUB_OUTPUT"
          fi
        done

  # Builds the apps that changed, as the check that they still build, and
  # on a push to main for the release jobs.
  apple-apps:
    needs: apple-gate
    if: needs.apple-gate.outputs.macos == 'true' || needs.apple-gate.outputs.ios == 'true'
    runs-on: ${{ needs.apple-gate.outputs.runner }}

    env:
      MACOS: ${{ needs.apple-gate.outputs.macos }}
      IOS: ${{ needs.apple-gate.outputs.ios }}
      MACOS_APP: ogygia-macos/Applications/Ogygia.app
      IOS_APP: ogygia-ios/Applications/Ogygia.app

    steps:
    - name: Checkout code
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with:
        fetch-depth: 0

    # No S3 cache step here: this job adds Xcode to the store, and Xcode's
    # licence forbids pushing it to the public cache.
    - name: Install Nix
      uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
      with:
        extra_nix_config: |
          accept-flake-config = true
          extra-substituters = https://nixcache.jakehillion.me
          extra-trusted-public-keys = nixcache.jakehillion.me-1:HQsjYdrcs3ilS/ngtlbTQXU4Xfsm+va5NN7yoK0wKMg=
          sandbox = true
          # The host paths app/xcode-build declares in __impureHostDeps.
          allowed-impure-host-deps = /System/Library /bin/sh /dev /usr/lib /usr/share/firmlinks /Library/Developer/PrivateFrameworks /Library/Apple/System/Library/PrivateFrameworks /Library/Preferences/com.apple.dt.Xcode.plist /usr/bin/codesign /usr/bin/touch

    # Xcode cannot be downloaded without an Apple ID, so the runner's copy
    # is added under the hash nixpkgs pins. A runner image whose Xcode
    # differs from the pin fails here rather than building with it. Both
    # apps build with the same Xcode.
    #
    # The store path's name is part of its hash, so it is added as Xcode.app,
    # the name nixpkgs pins, rather than under the runner's Xcode_27.app.
    - name: Add Xcode to the Nix store
      run: |
        expected="$(nix eval --raw .#packages.aarch64-darwin.ogygia-macos.xcode.outPath)"
        added="$(nix store add --name Xcode.app --mode nar --hash-algo sha256 /Applications/Xcode_27.app)"
        if [ "$added" != "$expected" ]; then
          echo "::error::Runner Xcode is $added, but the pin expects $expected"
          exit 1
        fi

    - name: Build the macOS app
      if: env.MACOS == 'true'
      run: nix build -L --out-link ogygia-macos .#packages.aarch64-darwin.ogygia-macos

    - name: Build the iOS app
      if: env.IOS == 'true'
      run: nix build -L --out-link ogygia-ios .#packages.aarch64-darwin.ogygia-ios

    # The build number is the flake's commit count, which falls back to 0
    # when history is missing; Sparkle would then never offer an update, and
    # TestFlight would reject the upload.
    - name: Check the build numbers
      run: |
        count="$(git rev-list --count HEAD)"
        if [ "$MACOS" = true ]; then
          test "$(plutil -extract CFBundleVersion raw "$MACOS_APP/Contents/Info.plist")" = "$count"
        fi
        if [ "$IOS" = true ]; then
          test "$(plutil -extract CFBundleVersion raw "$IOS_APP/Info.plist")" = "$count"
        fi

    # ditto keeps the framework symlinks and code signatures, which the
    # artifact upload would otherwise flatten.
    - name: Archive the apps for release
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: |
        if [ "$MACOS" = true ]; then
          mkdir -p "$RUNNER_TEMP/macos"
          ditto -c -k --keepParent "$MACOS_APP" "$RUNNER_TEMP/macos/Ogygia.app.zip"
        fi
        if [ "$IOS" = true ]; then
          mkdir -p "$RUNNER_TEMP/ios"
          ditto -c -k --keepParent "$IOS_APP" "$RUNNER_TEMP/ios/Ogygia.app.zip"
        fi

    - name: Upload the macOS app for release
      if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.MACOS == 'true'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: ogygia-macos
        path: ${{ runner.temp }}/macos/Ogygia.app.zip
        compression-level: 0
        retention-days: 1

    - name: Upload the iOS app for release
      if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.IOS == 'true'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: ogygia-ios
        path: ${{ runner.temp }}/ios/Ogygia.app.zip
        compression-level: 0
        retention-days: 1

  macos-app-release:
    needs: [apple-gate, apple-apps]
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.apple-gate.outputs.macos == 'true'
    runs-on: ${{ needs.apple-gate.outputs.runner }}

    # Releases run one at a time; a newer queued release replaces an older
    # pending one. Builds finish in any order, so the first step also skips
    # a release older than what the feed already offers.
    concurrency:
      group: macos-app-release
      cancel-in-progress: false

    env:
      ASSETS_BUCKET: ogygia-assets
      ASSETS_URL: https://assets.ogygia.dev
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_ENDPOINT_URL: https://28e45df51086264c6d9cf2b5e6ecc190.r2.cloudflarestorage.com
      # R2 does not accept every checksum newer AWS clients send by default.
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required

    steps:
    - name: Checkout code
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

    - name: Install Nix
      uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
      with:
        extra_nix_config: |
          accept-flake-config = true
          extra-substituters = https://nixcache.jakehillion.me
          extra-trusted-public-keys = nixcache.jakehillion.me-1:HQsjYdrcs3ilS/ngtlbTQXU4Xfsm+va5NN7yoK0wKMg=
          sandbox = true

    - name: Download the app
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
      with:
        name: ogygia-macos
        path: ${{ runner.temp }}

    - name: Unpack the app
      run: |
        mkdir -p "$RUNNER_TEMP/release"
        ditto -x -k "$RUNNER_TEMP/Ogygia.app.zip" "$RUNNER_TEMP/release"
        rm "$RUNNER_TEMP/Ogygia.app.zip"
        chmod -R u+w "$RUNNER_TEMP/release/Ogygia.app"

    # Read from the bucket rather than the CDN, whose copy may be stale.
    # Only one release runs at a time, so nothing can publish between this
    # check and the upload.
    - name: Check the feed is older than this build
      id: feed
      run: |
        build="$(plutil -extract CFBundleVersion raw "$RUNNER_TEMP/release/Ogygia.app/Contents/Info.plist")"
        aws() { nix run --inputs-from . nixpkgs#awscli2 -- "$@"; }
        if aws s3 cp "s3://$ASSETS_BUCKET/macos/appcast.xml" "$RUNNER_TEMP/published.xml"; then
          published="$(sed -n 's:.*<sparkle\:version>\([0-9]*\)</sparkle\:version>.*:\1:p' "$RUNNER_TEMP/published.xml")"
        else
          published=0
        fi
        if [ "${published:-0}" -ge "$build" ]; then
          echo "::notice::The feed already offers build $published; skipping build $build"
          echo "release=false" >> "$GITHUB_OUTPUT"
        else
          echo "release=true" >> "$GITHUB_OUTPUT"
        fi

    # Everything below runs outside the Nix sandbox: it needs the signing
    # identity, Apple's notary service and the asset bucket, none of which
    # belong in a derivation. It only signs and publishes what Nix built.
    - name: Import the Developer ID certificate
      if: steps.feed.outputs.release == 'true'
      env:
        MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
        MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      run: |
        keychain="$RUNNER_TEMP/signing.keychain-db"
        keychain_password="$(openssl rand -hex 32)"
        security create-keychain -p "$keychain_password" "$keychain"
        security set-keychain-settings -lut 21600 "$keychain"
        security unlock-keychain -p "$keychain_password" "$keychain"
        echo "$MACOS_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
        security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$MACOS_CERT_PASSWORD" -f pkcs12 -T /usr/bin/codesign
        rm "$RUNNER_TEMP/cert.p12"
        security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain" > /dev/null
        # Keep the existing search list; its entries are space-free paths.
        # shellcheck disable=SC2046
        security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')

    - name: Sign
      if: steps.feed.outputs.release == 'true'
      run: |
        app="$RUNNER_TEMP/release/Ogygia.app"

        if [ -z "$(plutil -extract SUPublicEDKey raw "$app/Contents/Info.plist")" ]; then
          echo "::error::SPARKLE_PUBLIC_ED_KEY is empty, so this build could never verify an update"
          exit 1
        fi

        # Inside out, as Sparkle documents for apps outside the App Sandbox.
        sign() { codesign --force --sign "Developer ID Application" --options runtime --timestamp "$@"; }
        sparkle="$app/Contents/Frameworks/Sparkle.framework"
        sign "$sparkle/Versions/B/XPCServices/Installer.xpc"
        sign --preserve-metadata=entitlements "$sparkle/Versions/B/XPCServices/Downloader.xpc"
        sign "$sparkle/Versions/B/Autoupdate"
        sign "$sparkle/Versions/B/Updater.app"
        sign "$sparkle"
        # The Nebula daemon and the Nebula it runs, which launchd starts from
        # the bundle as root.
        for helper in ogygia-macos-nebulad nebula nebula-cert; do
          sign "$app/Contents/MacOS/$helper"
        done
        sign --entitlements app/macos/Ogygia/Ogygia.entitlements "$app"
        codesign --verify --deep --strict --verbose=2 "$app"

    - name: Notarise
      if: steps.feed.outputs.release == 'true'
      env:
        ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      run: |
        app="$RUNNER_TEMP/release/Ogygia.app"
        key="$RUNNER_TEMP/AuthKey.p8"
        echo "$ASC_KEY_P8" > "$key"
        ditto -c -k --keepParent "$app" "$RUNNER_TEMP/notarise.zip"
        xcrun notarytool submit "$RUNNER_TEMP/notarise.zip" \
          --key "$key" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" --wait
        rm "$key" "$RUNNER_TEMP/notarise.zip"
        xcrun stapler staple "$app"
        spctl --assess --type execute --verbose=2 "$app"

    # The image holds the stapled app beside a link to /Applications, so
    # installing is a drag from one to the other. It is notarised in its
    # own right, so Gatekeeper accepts it when opened, while the app
    # inside keeps its own ticket for when it runs from Applications.
    - name: Make the disk image
      if: steps.feed.outputs.release == 'true'
      env:
        ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      run: |
        app="$RUNNER_TEMP/release/Ogygia.app"
        plist="$app/Contents/Info.plist"
        version="$(plutil -extract CFBundleShortVersionString raw "$plist")"
        build="$(plutil -extract CFBundleVersion raw "$plist")"
        dmg="$RUNNER_TEMP/release/Ogygia-$version-$build.dmg"

        stage="$RUNNER_TEMP/dmg"
        mkdir "$stage"
        ditto "$app" "$stage/Ogygia.app"
        ln -s /Applications "$stage/Applications"
        # APFS with lzfse, which Sparkle recommends for updating from images.
        diskutil image create from --format ULFO --volumeName Ogygia "$stage" "$dmg"
        rm -rf "$stage"

        codesign --sign "Developer ID Application" --timestamp "$dmg"
        key="$RUNNER_TEMP/AuthKey.p8"
        echo "$ASC_KEY_P8" > "$key"
        xcrun notarytool submit "$dmg" \
          --key "$key" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" --wait
        rm "$key"
        xcrun stapler staple "$dmg"
        spctl --assess --type open --context context:primary-signature --verbose=2 "$dmg"

    - name: Publish
      if: steps.feed.outputs.release == 'true'
      env:
        SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
      run: |
        app="$RUNNER_TEMP/release/Ogygia.app"
        plist="$app/Contents/Info.plist"
        version="$(plutil -extract CFBundleShortVersionString raw "$plist")"
        build="$(plutil -extract CFBundleVersion raw "$plist")"
        minimum="$(plutil -extract LSMinimumSystemVersion raw "$plist")"
        archive="Ogygia-$version-$build.dmg"
        # Releases are stored by content, so a name never changes what it
        # holds and can be cached forever. A rebuild of the same commit
        # signs and notarises afresh, so reusing a versioned name would let
        # caches serve bytes that no longer match the feed's signature.
        object="macos/$(shasum -a 256 "$RUNNER_TEMP/release/$archive" | cut -d' ' -f1).dmg"

        tools="$(nix build --no-link --print-out-paths .#packages.aarch64-darwin.ogygia-macos.sparkleTools)"
        signature="$(echo "$SPARKLE_ED_PRIVATE_KEY" | "$tools/bin/sign_update" --ed-key-file - -p "$RUNNER_TEMP/release/$archive")"
        length="$(stat -f %z "$RUNNER_TEMP/release/$archive")"

        # One channel, so the feed only ever lists the newest build; Sparkle
        # never offers an update older than what is installed.
        cat > "$RUNNER_TEMP/appcast.xml" <<XML
        <?xml version="1.0" encoding="utf-8"?>
        <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">
          <channel>
            <title>Ogygia</title>
            <item>
              <title>Ogygia $version ($build)</title>
              <pubDate>$(LC_ALL=C date -u "+%a, %d %b %Y %H:%M:%S +0000")</pubDate>
              <sparkle:version>$build</sparkle:version>
              <sparkle:shortVersionString>$version</sparkle:shortVersionString>
              <sparkle:minimumSystemVersion>$minimum</sparkle:minimumSystemVersion>
              <enclosure url="$ASSETS_URL/$object" length="$length" type="application/x-apple-diskimage" sparkle:edSignature="$signature"/>
            </item>
          </channel>
        </rss>
        XML
        # The feed is signed too, so the bucket is trusted for neither.
        echo "$SPARKLE_ED_PRIVATE_KEY" | "$tools/bin/sign_update" --ed-key-file - "$RUNNER_TEMP/appcast.xml"

        aws() { nix run --inputs-from . nixpkgs#awscli2 -- "$@"; }
        # The image must exist before the feed points at it.
        aws s3 cp "$RUNNER_TEMP/release/$archive" "s3://$ASSETS_BUCKET/$object" \
          --content-type application/x-apple-diskimage --cache-control "public, max-age=31536000, immutable"
        # A fixed name to link downloads to; it always holds the newest build.
        aws s3 cp "$RUNNER_TEMP/release/$archive" "s3://$ASSETS_BUCKET/macos/Ogygia.dmg" \
          --content-type application/x-apple-diskimage --cache-control "public, max-age=300"
        aws s3 cp "$RUNNER_TEMP/appcast.xml" "s3://$ASSETS_BUCKET/macos/appcast.xml" \
          --content-type application/xml --cache-control "public, max-age=300"

  ios-app-release:
    needs: [apple-gate, apple-apps]
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.apple-gate.outputs.ios == 'true'
    runs-on: ${{ needs.apple-gate.outputs.runner }}

    # Releases run one at a time; a newer queued release replaces an older
    # pending one. Builds finish in any order, so the first step also skips
    # a release older than what TestFlight already has.
    concurrency:
      group: ios-app-release
      cancel-in-progress: false

    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}

    # Everything here runs outside the Nix sandbox: it needs the signing
    # identity and App Store Connect, neither of which belongs in a
    # derivation. It only signs and uploads what Nix built.
    steps:
    - name: Download the app
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
      with:
        name: ogygia-ios
        path: ${{ runner.temp }}

    # An .ipa is a zip with the app under Payload/.
    - name: Unpack the app
      run: |
        mkdir -p "$RUNNER_TEMP/release/Payload"
        ditto -x -k "$RUNNER_TEMP/Ogygia.app.zip" "$RUNNER_TEMP/release/Payload"
        rm "$RUNNER_TEMP/Ogygia.app.zip"
        chmod -R u+w "$RUNNER_TEMP/release/Payload/Ogygia.app"

    - name: Write the App Store Connect key
      env:
        ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      run: |
        echo "$ASC_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"

    # App Store Connect rejects a build number it has already seen, so a
    # build that finished after a newer one is skipped rather than failed.
    - name: Check TestFlight has nothing newer than this build
      id: testflight
      run: |
        plist="$RUNNER_TEMP/release/Payload/Ogygia.app/Info.plist"
        build="$(plutil -extract CFBundleVersion raw "$plist")"
        bundle_id="$(plutil -extract CFBundleIdentifier raw "$plist")"
        # altool prints the token on stderr, after its own banner.
        token="$(xcrun altool --generate-jwt --api-key "$ASC_KEY_ID" --api-issuer "$ASC_ISSUER_ID" \
          --p8-file-path "$RUNNER_TEMP/AuthKey.p8" 2>&1 | grep '^eyJ')"
        api() { curl -fsSG -H "Authorization: Bearer $token" "https://api.appstoreconnect.apple.com/v1/$1" "${@:2}"; }
        app_id="$(api apps --data-urlencode "filter[bundleId]=$bundle_id" | plutil -extract data.0.id raw -o - -)"
        # Builds are only ever uploaded in increasing order, so the newest
        # upload has the highest build number.
        builds="$(api builds --data-urlencode "filter[app]=$app_id" --data-urlencode "sort=-uploadedDate" \
          --data-urlencode "limit=1" --data-urlencode "fields[builds]=version")"
        # An app with no builds yet has an empty list.
        latest="$(printf '%s' "$builds" | plutil -extract data.0.attributes.version raw -o - - 2>/dev/null || echo 0)"
        if [ "$latest" -ge "$build" ]; then
          echo "::notice::TestFlight already has build $latest; skipping build $build"
          echo "release=false" >> "$GITHUB_OUTPUT"
        else
          echo "release=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Import the Apple Distribution certificate
      if: steps.testflight.outputs.release == 'true'
      env:
        IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
        IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
      run: |
        keychain="$RUNNER_TEMP/signing.keychain-db"
        keychain_password="$(openssl rand -hex 32)"
        security create-keychain -p "$keychain_password" "$keychain"
        security set-keychain-settings -lut 21600 "$keychain"
        security unlock-keychain -p "$keychain_password" "$keychain"
        echo "$IOS_DIST_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
        security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$IOS_DIST_CERT_PASSWORD" -f pkcs12 -T /usr/bin/codesign
        rm "$RUNNER_TEMP/cert.p12"
        security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain" > /dev/null
        # Keep the existing search list; its entries are space-free paths.
        # shellcheck disable=SC2046
        security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')

    # The entitlements are copied from the provisioning profile, limited to
    # the ones an app with no capabilities is signed with.
    - name: Sign
      if: steps.testflight.outputs.release == 'true'
      env:
        IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
      run: |
        app="$RUNNER_TEMP/release/Payload/Ogygia.app"
        profile="$app/embedded.mobileprovision"
        echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$profile"
        security cms -D -i "$profile" > "$RUNNER_TEMP/profile.plist"

        # A missing entitlement reads as empty, so the checks below report it.
        entitlement() { /usr/libexec/PlistBuddy -c "Print :Entitlements:$1" "$RUNNER_TEMP/profile.plist" 2>/dev/null || true; }
        app_identifier="$(entitlement application-identifier)"
        team="$(entitlement com.apple.developer.team-identifier)"
        get_task_allow="$(entitlement get-task-allow)"
        beta_reports_active="$(entitlement beta-reports-active)"
        bundle_id="$(plutil -extract CFBundleIdentifier raw "$app/Info.plist")"
        if [ "$app_identifier" != "$team.$bundle_id" ]; then
          echo "::error::The profile is for $app_identifier, not $team.$bundle_id"
          exit 1
        fi
        if [ "$get_task_allow" != false ] || [ "$beta_reports_active" != true ]; then
          echo "::error::The profile is not an App Store distribution profile"
          exit 1
        fi

        entitlements="$RUNNER_TEMP/entitlements.plist"
        /usr/libexec/PlistBuddy \
          -c "Add :application-identifier string $app_identifier" \
          -c "Add :com.apple.developer.team-identifier string $team" \
          -c "Add :get-task-allow bool false" \
          -c "Add :beta-reports-active bool true" \
          "$entitlements"

        codesign --force --sign "Apple Distribution: " --keychain "$RUNNER_TEMP/signing.keychain-db" \
          --entitlements "$entitlements" "$app"
        codesign --verify --deep --strict --verbose=2 "$app"

    - name: Upload to TestFlight
      if: steps.testflight.outputs.release == 'true'
      run: |
        cd "$RUNNER_TEMP/release"
        # Extended attributes would be packed as ._ files that the signature
        # doesn't cover.
        ditto -c -k --norsrc --noextattr --keepParent Payload Ogygia.ipa
        # Waiting until App Store Connect lists the build means the next
        # release's check sees it.
        xcrun altool --upload-package Ogygia.ipa --wait \
          --api-key "$ASC_KEY_ID" --api-issuer "$ASC_ISSUER_ID" --p8-file-path "$RUNNER_TEMP/AuthKey.p8"

  single-commit:
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout code
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with:
        fetch-depth: 2

    # The queue rebase-merges, landing every commit of a PR. Each entry must
    # add exactly one commit on top of the entry ahead of it.
    - name: Require one commit per queued change
      run: |
        if [ "$(git log -1 --format=%P HEAD)" != "${{ github.event.merge_group.base_sha }}" ]; then
          echo "::error::A queued change must be exactly one commit"
          exit 1
        fi

  all-checks:
    needs: [nix, apple-gate, apple-apps, single-commit]
    if: always()
    runs-on: ubuntu-24.04

    steps:
    # apple-apps may only be skipped when the gate found no app to build.
    - name: Require every check job to pass
      run: |
        test "${{ needs.nix.result }}" = success
        test "${{ needs.apple-gate.result }}" = success
        case "${{ needs.apple-apps.result }}" in
          success) ;;
          skipped)
            test "${{ needs.apple-gate.outputs.macos }}" = false
            test "${{ needs.apple-gate.outputs.ios }}" = false
            ;;
          *) exit 1 ;;
        esac
        if [ "${{ github.event_name }}" = merge_group ]; then
          test "${{ needs.single-commit.result }}" = success
        fi
