[package]
name = "ogygia"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["irisd", "nebula", "updated"]
irisd = [
    "dep:reqwest",
    "dep:serde_json",
    "dep:futures",
    "dep:ogygia-nixutils",
]
nebula = [
    "dep:tempfile",
    "dep:which",
    "dep:serde_json",
    "dep:chrono",
    "dep:ogygia-nixutils",
]
updated = [
    "dep:chrono",
    "dep:serde_json",
    "dep:ogygia-updated",
    "dep:humantime",
]

[dependencies]
clap = { workspace = true }
clap_complete = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
etcd-client = { workspace = true }
hostname = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "process", "io-util"] }

# Optional deps for irisd feature
reqwest = { workspace = true, features = ["json"], optional = true }
serde_json = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
ogygia-nixutils = { path = "../ogygia-nixutils", optional = true }

# Optional deps for nebula feature
tempfile = { workspace = true, optional = true }
which = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }

# Optional deps for updated feature
ogygia-updated = { path = "../ogygia-updated", optional = true }
humantime = { workspace = true, optional = true }
