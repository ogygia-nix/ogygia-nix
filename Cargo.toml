[workspace]
# Wildcard membership allows Nix builds to omit non-target crates
# from the source tree without causing Cargo workspace errors.
members = ["src/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.metadata.crane]
name = "ogygia-workspace"

[workspace.dependencies]
# CLI and config
clap = { version = "4.5", features = ["derive", "env"] }
clap_complete = { version = "4.5", features = ["unstable-dynamic"] }
anyhow = "1.0"
humantime = "2"
serde = { version = "1.0", features = ["derive"] }
toml = "1.0"
toml_parser = "1.1"
etcd-client = "0.21"
hostname = "0.4"
strum = { version = "0.28", features = ["derive"] }

# HTTP server
axum = { version = "0.8", features = ["http2"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["trace"] }

# HTTP client
reqwest = { version = "0.13", default-features = false, features = ["stream", "gzip", "rustls"] }

# Bloom filters
fastbloom = "0.17"
arc-swap = "1"

# Randomization
rand = "0.10"

# Cryptography and hashing
base64 = "0.23"
sha2 = "0.10"
hex = "0.4"
siphasher = "1"

# Nix store database (read-only SQLite access via an async connection pool)
rusqlite = { version = "0.38", features = ["bundled"] }
deadpool-sqlite = "0.13"

# Integration testing against a real Nix store
testcontainers = "0.28"
rstest = "0.28"

# Cache
moka = { version = "0.12", features = ["future"] }

# Compression
async-compression = { version = "0.4", features = ["tokio", "zstd", "xz", "gzip"] }

# Archives
bzip2 = "0.6"
flate2 = "1"
liblzma = "0.4"
tar = "0.4"
zip = { version = "9", default-features = false, features = ["bzip2", "deflate-flate2", "lzma", "xz", "zstd"] }
zstd = "0.14"

# Serialization
bincode = "1"
serde_json = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# Git
git2 = "0.21"
gix = { version = "0.90", default-features = false, features = ["sha1", "index", "status"] }
tempfile = "3.0"

# Enums
enum-map = "3.0"

# Utilities
bytes = "1"
futures = "0.3"
async-stream = "0.3"
thiserror = "2"

# Filesystem watching
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }

# macOS preferences (the `defaults` system)
core-foundation = "0.10"
core-foundation-sys = "0.8"

# Process utilities
which = "8"

# Nix evaluation
ariadne = "0.6"
bumpalo = "3"
lasso = { version = "0.7", features = ["multi-threaded"] }
md-5 = "0.11"
num-bigint = "0.5"
sha1 = "0.10"
regex = "1"
regex-automata = "0.4"
rnix = "0.14"
rowan = "0.16"

# Custom test harnesses
libtest-mimic = "0.8"

# Snapshot testing
insta = "1"

# Fuzzing
libc = "0.2"
libfuzzer-sys = "0.4"
